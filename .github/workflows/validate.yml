name: Validate

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check taxonomy and duplicates
        run: python scripts/sync_metadata.py --check --offline

      - name: Views are up to date
        run: |
          python scripts/generate_readme.py
          if ! git diff --quiet README.md TIMELINE.md BY_INSTITUTION.md; then
            echo "::error::Generated views are stale. Run: python scripts/generate_readme.py"
            git --no-pager diff --stat README.md TIMELINE.md BY_INSTITUTION.md
            exit 1
          fi
