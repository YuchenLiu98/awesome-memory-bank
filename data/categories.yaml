# Taxonomy for Awesome Memory Bank
#
# Scope: papers whose *core contribution* is memory -- storing, retrieving,
# consolidating or forgetting information across time. A strong model that
# merely happens to have a KV cache does not belong here.
#
# This file is the single source of truth for:
#   1. the section / subcategory structure rendered into README.md
#   2. the keywords used by scripts/fetch_arxiv.py to gate and auto-classify
#      newly crawled arXiv papers
#
# Adding a subcategory here is enough: the generator and the crawler pick it
# up automatically. `keywords` are matched case-insensitively against the
# title + abstract; `weight` boosts a subcategory when several ones match.

meta:
  title: Awesome Memory Bank
  subtitle: >-
    A curated, auto-updated collection of papers on memory in foundation
    models -- long-term and episodic memory, memory architectures, retrieval
    and consolidation -- split across LLM/Agent, VLM and VLA systems.
  repo: YuchenLiu98/awesome-memory-bank
  license: CC0 1.0

sections:
