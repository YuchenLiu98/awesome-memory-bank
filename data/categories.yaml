# Search configuration for scripts/fetch_arxiv.py.
#
# One broad query per arXiv category rather than a hand-tuned phrase list per
# track. Enumerating phrases at the API always loses papers that use wording
# nobody thought of; casting `abs:"memory"` over a whole category and doing the
# real filtering locally does not. On a 2026 backfill this returned 839 memory
# papers where the phrase-based queries had found a few dozen.
arxiv:
  queries:
    - id: cs.CL
      query: 'cat:cs.CL AND abs:"memory"'
    - id: cs.CV
      query: 'cat:cs.CV AND abs:"memory"'
    - id: cs.RO
      query: 'cat:cs.RO AND abs:"memory"'
    - id: cs.AI
      query: 'cat:cs.AI AND abs:"memory"'
    - id: cs.LG
      query: 'cat:cs.LG AND abs:"memory"'

  # A paper's *primary* category must be one of these. arXiv cross-lists
  # liberally, and without this a statistical-mechanics paper on associative
  # memory or an acoustic anomaly detector lands in the digest.
  primary_categories:
    - cs.AI
    - cs.CL
    - cs.CV
    - cs.LG
    - cs.RO
    - cs.MA
    - cs.IR
    - cs.HC

  # ---------------------------------------------------------------------
  # The memory gate. This is what keeps the list on-topic.
  #
  # A paper is only considered if it contains at least one STRONG phrase
  # below. The bare word "memory" is deliberately absent: in ML papers it
  # usually means VRAM, not cognition.
  # ---------------------------------------------------------------------
  memory_keywords:
    - memory bank
    - long-term memory
    - long term memory
    - short-term memory
    - working memory
    - episodic memory
    - semantic memory
    - procedural memory
    - associative memory
    - external memory
    - persistent memory
    - lifelong memory
    - spatial memory
    - scene memory
    - visual memory
    - multimodal memory
    - agent memory
    - robot memory
    - embodied memory
    - memory module
    - memory mechanism
    - memory architecture
    - memory-augmented
    - memory augmented
    - memory retrieval
    - memory consolidation
    - memory management
    - memory system
    - memory network
    - memory token
    - memory compression
    - memory update
    - memory store
    - memorization
    - memorize
    - recall past
    - catastrophic forgetting
    - knowledge editing
    - model editing
    - retrieval-augmented
    - kv cache
    - key-value cache
    - context compression
    - attention sink
    - topological memory
    - skill library
    - experience replay

  # Phrases where "memory" means hardware. A paper matching only these is
  # dropped: "memory-efficient training" is a systems paper, not a memory one.
  hardware_memory_keywords:
    - memory-efficient
    - memory efficient
    - memory footprint
    - gpu memory
    - memory usage
    - memory bandwidth
    - memory consumption
    - memory overhead
    - out-of-memory
    - memory cost
    - high bandwidth memory
    - memory access
    - shared memory architecture

  # A paper must also look like it belongs to one of the three tracks.
  gate_keywords:
    - large language model
    - language model
    - llm
    - vision-language
    - vision language
    - multimodal
    - mllm
    - vlm
    - vla
    - vision-language-action
    - embodied
    - agent
    - robot
    - navigation
    - video understanding
    - foundation model
    - transformer

  # Applied-domain papers that use a memory module as a component. They are
  # real work, but a reader here is looking for memory research, not for the
  # latest MRI synthesis method that happens to have a memory bank in it.
  block_keywords:
    - federated learning
    - medical image segmentation
    - mri
    - radiolog
    - clinical
    - electronic health
    - protein
    - molecul
    - drug discovery
    - recommendation system
    - time series forecasting
    - stock
    - financial market
    - photovoltaic
    - power grid
    - anomalous sound
    - speech enhancement
    - essay scoring
    - remote sensing
    - green-space
    - bridge diagnos
    - crop
    - memristor
    - in-memory computing
