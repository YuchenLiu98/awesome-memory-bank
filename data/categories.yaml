    title_zh: 语言模型与智能体的记忆
    short: LLM
    description: >-
      Memory in language-only systems: memory operating systems, long-term and
      personalized memory, parametric memory editing, context compression, and
      the experience stores that let agents improve over time.
    subcategories:
