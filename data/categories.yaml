# Search configuration for scripts/fetch_arxiv.py.
#
# One query per track keeps each request small enough for the arXiv API while
# still covering the three tracks independently. Edit these to widen or narrow
# the daily crawl.
arxiv:
  queries:
    - id: llm
      query: >-
        (cat:cs.CL OR cat:cs.AI) AND (abs:"large language model" OR abs:"LLM agent"
        OR abs:"agentic" OR abs:"chain-of-thought" OR abs:"reasoning model"
        OR abs:"test-time scaling" OR abs:"tool use" OR abs:"multi-agent")
    - id: vlm
      query: >-
        (cat:cs.CV OR cat:cs.CL) AND (abs:"vision-language model"
        OR abs:"multimodal large language model" OR abs:"MLLM"
        OR abs:"visual instruction" OR abs:"video understanding"
        OR abs:"GUI agent" OR abs:"spatial reasoning")
    - id: vla
      query: >-
        (cat:cs.RO OR cat:cs.CV OR cat:cs.LG) AND (abs:"vision-language-action"
        OR abs:"robot manipulation" OR abs:"embodied agent" OR abs:"robot policy"
        OR abs:"autonomous driving" OR abs:"world model" OR abs:"humanoid")
  categories:
    - cs.AI
    - cs.CL
    - cs.CV
    - cs.LG
    - cs.RO
  # A paper must match at least one of these to enter the candidate queue.
  gate_keywords:
    - large language model
    - language model
    - llm
    - vision-language
    - vision language
    - multimodal
    - mllm
    - vlm
    - vla
    - vision-language-action
    - embodied
    - agent
    - robot
    - autonomous driving
    - world model
    - reasoning
  # Papers whose title matches these are dropped as noise.
  block_keywords:
    - federated learning
    - medical image segmentation
    - recommendation system
    - time series forecasting
    - protein
    - speech enhancement

